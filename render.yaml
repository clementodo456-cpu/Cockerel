services:
  - type: worker
    name: telegram-daily-planner-bot
    env: python
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    autoDeploy: true
    envVars:
      - key: BOT_TOKEN
        sync: false
    disk:
      name: bot-sqlite-data
      mountPath: /var/data
      sizeGB: 1
